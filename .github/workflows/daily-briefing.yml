name: Daily AI Briefing

on:
  schedule:
    - cron: '0 4 * * *'  # 北京时间 12:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          PAGES_BASE_URL: https://wutong19960510-eng.github.io/ai-daily-briefing
          BRIEFING_CONFIG: scripts/configs/ai.json
        run: python scripts/generate_briefing.py

      - name: Commit and push
        run: |
          git config user.name "AI Briefing Bot"
          git config user.email "bot@noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "📡 AI 简报 · $(date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          curl -s -X POST "$BARK_URL" \
            -H "Content-Type: application/json" \
            -d '{"title":"❌ 简报生成失败","body":"GitHub Actions workflow failed, check logs","level":"timeSensitive"}'
