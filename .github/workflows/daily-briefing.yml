name: Daily AI Briefing

on:
  schedule:
    # 每天中午 12:00 北京时间 = UTC 4:00
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          NOTION_BRIEFING_PAGE_ID: ${{ secrets.NOTION_BRIEFING_PAGE_ID }}
          PAGES_BASE_URL: https://wutong19960510-eng.github.io/ai-daily-briefing
        run: python scripts/generate_briefing.py

      - name: Commit and push HTML
        run: |
          git config user.name "AI Briefing Bot"
          git config user.email "bot@noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "📡 AI 简报 · $(date +%Y-%m-%d)"
          git push
