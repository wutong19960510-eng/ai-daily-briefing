<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 简报 · 2026-04-05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
  }
  .screen-inner {
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }

  /* Intro */
  .screen-intro {
    background: #fafafa;
  }
  .intro-date {
    font-size: 12px;
    letter-spacing: 2px;
    color: #aaa;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .intro-text {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.7;
    color: #1a1a1a;
  }
  .intro-hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ccc;
    animation: bounce 2s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }

  /* Story */
  .screen-story {
    background: #fff;
    border-bottom: 1px solid #f0f0f0;
  }
  .story-label {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 6px;
    margin-bottom: 12px;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .story-headline {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .story-text {
    font-size: 17px;
    line-height: 2;
    color: #2a2a2a;
  }
  .story-text p {
    margin-bottom: 14px;
  }
  .story-text p:last-child {
    margin-bottom: 0;
  }
  .story-text strong {
    color: #1a1a1a;
    font-weight: 600;
    background: linear-gradient(to top, rgba(91,94,166,0.12) 40%, transparent 40%);
    padding: 0 2px;
  }

  /* Card (人物/公司/术语) */
  .screen-card {
    background: #f5f5fa;
  }
  .card-badge {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  .card-name {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 14px;
  }
  .card-text {
    font-size: 17px;
    line-height: 2;
    color: #444;
  }
  .card-text strong {
    font-weight: 600;
    color: #1a1a1a;
  }

  /* Outro */
  .screen-outro {
    background: #fafafa;
  }
  .outro-text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.8;
    color: #1a1a1a;
  }
  .outro-bye {
    margin-top: 20px;
    font-size: 14px;
    color: #aaa;
  }
  .outro-nav {
    margin-top: 28px;
  }
  .outro-nav a {
    font-size: 13px;
    color: #5b5ea6;
    text-decoration: none;
    padding: 8px 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  /* Progress dots */
  .progress {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ddd;
    transition: all 0.3s;
  }
  .dot.active {
    background: #5b5ea6;
    transform: scale(1.5);
  }

  @media (max-width: 480px) {
    .screen { padding: 32px 20px; }
    .intro-text { font-size: 20px; }
    .story-headline { font-size: 20px; }
    .story-text { font-size: 16px; line-height: 1.95; }
    .card-name { font-size: 22px; }
    .outro-text { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="progress" id="progress">
  <div class="dot  active"></div>
</div>

<div class="screen screen-intro">
  <div class="screen-inner">
    <div class="intro-date">AI 简报 · 2026-04-05</div>
    <div class="intro-text">今天的简报生成遇到了点问题，明天见。</div>
  </div>
  <div class="intro-hint">↓ 向下滑动</div>
</div>


<script>
  const screens = document.querySelectorAll('.screen');
  const dots = document.querySelectorAll('.dot');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = [...screens].indexOf(entry.target);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      }
    });
  }, { threshold: 0.5 });
  screens.forEach(s => observer.observe(s));
</script>

</body>
</html>
